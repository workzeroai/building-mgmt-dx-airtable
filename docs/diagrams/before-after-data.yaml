# 데이터 관리 개선 전/후 (일반화한 예시, 가상 회사 기준)
# 그림: python ../../../_design/excalidraw_kit.py before-after-data.yaml --out . --export
name: before-after-data
title: 데이터 관리 — 개선 전 / 후
subtitle: 사업부마다 따로 있던 Excel을 공통 원본(허브) + 사업부 Base로 나누고, 동기화 안전장치가 사본을 지킨다
layout: grid
gapX: 80
gapY: 120
maxTextWidth: 190
nodes:
  - {id: b1, label: "사업부마다\n따로 쓰는 Excel", role: neutral, col: 0, row: 0}
  - {id: b2, label: "같은 고객·건물이\n표기만 달리 중복", role: neutral, col: 1, row: 0}
  - {id: b3, label: "보고·견적 때마다\n파일을 찾아 합침", role: neutral, col: 2, row: 0}
  - {id: b4, label: "누가 언제 바꿨는지\n알 수 없음", role: danger, shape: ellipse, col: 3, row: 0}
  - {id: a1, label: "정제 순서\n주소 표준화 → 중복\n→ 연결", role: neutral, col: 0, row: 1}
  - {id: a2, label: "허브 Base\n고객·건물·담당자\n원본 한 곳", role: info, col: 1, row: 1}
  - {id: a3, label: "동기화 안전장치\n원본 급감 시 중단\n실패 건만 건너뜀", role: warning, col: 2, row: 1}
  - {id: a4, label: "사업부 Base ×3\n읽기 전용 사본\n+ 견적·계약·점검", role: info, col: 3, row: 1}
edges:
  - {from: b1, to: b2}
  - {from: b2, to: b3}
  - {from: b3, to: b4, style: dashed, role: danger}
  - {from: a1, to: a2}
  - {from: a2, to: a3}
  - {from: a3, to: a4, label: 사본}
zones:
  - {id: before, label: 개선 전 — 파일마다 다른 원본, nodes: [b1, b2, b3, b4], role: danger}
  - {id: after, label: 개선 후 — 원본 하나 + 사업부 확장, nodes: [a1, a2, a3, a4], role: info}
