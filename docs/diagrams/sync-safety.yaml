# 허브 → 사업부 동기화 안전장치 흐름(에어테이블 스크립트·n8n 공통 판정)
# 그림: python ../../../_design/excalidraw_kit.py sync-safety.yaml --out . --export
name: sync-safety
title: 허브 → 사업부 동기화 안전장치
subtitle: 원본이 이상하면 멈추고, 한 건의 실패는 그 건만 건너뛴다. 판정 코드는 에어테이블 스크립트와 n8n이 같다(lib/sync-core.js)
layout: grid
columns: 6
gapX: 100
gapY: 90
maxTextWidth: 180
nodes:
  - {id: sched, label: "일정\n매시 정각", role: neutral, col: 0, row: 0}
  - {id: fetch, label: "허브 원본 조회\n페이지 끝까지", role: neutral, col: 1, row: 0}
  - {id: volume, label: "직전 대비\n30% 넘게\n줄었나?", role: warning, shape: diamond, col: 2, row: 0}
  - {id: check, label: "건 단위 검증\nid 형식·필수·타입", role: warning, col: 3, row: 0}
  - {id: write, label: "생성·수정\n50건 묶음", role: success, col: 4, row: 0}
  - {id: abort, label: "반영 중단\n기록 + 알림", role: danger, col: 2, row: 1}
  - {id: skip, label: "건너뜀·실패\n자동화 오류에 기록", role: danger, col: 3, row: 1}
  - {id: retry, label: "묶음 실패 →\n한 건씩 다시 쓰기", role: warning, col: 4, row: 1}
  - {id: log, label: "동기화 기록\n다음 실행의 비교 기준", role: neutral, col: 5, row: 1}
  - {id: missing, label: "허브에서 사라진 건\nhubMissing 표시\n(삭제 안 함)", role: neutral, col: 5, row: 0}
edges:
  - {from: sched, to: fetch}
  - {from: fetch, to: volume}
  - {from: volume, to: abort, label: 예, role: danger}
  - {from: volume, to: check, label: 아니오}
  - {from: check, to: write, label: 통과, role: success}
  - {from: check, to: skip, label: 실패, role: danger}
  - {from: write, to: retry, label: 오류, style: dashed}
  - {from: retry, to: skip, label: 그 건만}
  - {from: write, to: missing}
  - {from: missing, to: log}
