# 자동화 패턴: 트리거 → 조건 → 안전장치 → 액션, 실패는 한곳에 모아 한 번에 알림
# 그림: python ../../../_design/excalidraw_kit.py automation-pattern.yaml --out . --export
name: automation-pattern
title: 자동화 패턴 — 트리거 → 조건 → 액션 + 안전장치
subtitle: 가상 스키마 기준 11개 패턴(airtable/automations/catalog.md). 지우지 않고, 이상하면 멈추고, 실패는 모아서 한 번에 알린다
layout: grid
columns: 4
gapX: 110
gapY: 90
maxTextWidth: 190
nodes:
  - {id: trigger, label: "트리거\n레코드 생성·수정\n일정·버튼", role: neutral, col: 0, row: 0}
  - {id: cond, label: "조건 충족?", role: warning, shape: diamond, col: 1, row: 0}
  - {id: guard, label: "안전장치\n허용 전이 · 중복 후보\n원본 급감 · 건 단위 검증", role: warning, col: 2, row: 0}
  - {id: action, label: "액션\n레코드 생성·수정\n후보·사라짐 표시", role: success, col: 3, row: 0}
  - {id: skip, label: "그대로 둠", role: neutral, shape: ellipse, col: 1, row: 1}
  - {id: revert, label: "되돌리기 · 건너뛰기\n(삭제·병합 없음)", role: danger, col: 2, row: 1}
  - {id: errors, label: "자동화 오류 테이블\n모든 자동화가 여기에", role: neutral, col: 3, row: 1}
  - {id: alert, label: "오류 요약 알림\n자동화별로 묶어 웹훅 1회", role: danger, col: 3, row: 2}
edges:
  - {from: trigger, to: cond}
  - {from: cond, to: guard, label: 예}
  - {from: cond, to: skip, label: 아니오}
  - {from: guard, to: action, label: 통과, role: success}
  - {from: guard, to: revert, label: 막힘, role: danger}
  - {from: revert, to: errors, label: 사유 기록}
  - {from: action, to: errors, label: 실패 건, style: dashed}
  - {from: errors, to: alert}
