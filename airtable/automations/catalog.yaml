# 자동화 패턴 카탈로그 — 트리거 → 조건 → 액션 (가상 스키마 기준)
# catalog.md는 이 파일에서 만든다(npm run airtable:build). 적힌 테이블·필드는 스키마에 있어야 한다(테스트가 확인).
#   base: hub | division     table: 테이블 key
#   watch: 트리거가 보는 필드   reads: 조건·액션이 읽는 필드   writes: { 테이블 key: [쓰는 필드] }
#   impl: builtin(에어테이블 기본 액션) | script:<파일> | n8n:<파일>
patterns:
  - id: A01
    name: 견적 수주 → 계약 생성
    base: division
    table: quotes
    trigger: "레코드가 조건에 맞을 때: status = won"
    watch: [status]
    condition: "연결된 계약이 없음(역방향 연결 '계약'이 비어 있음)"
    reads: [계약, id, quoteNo, customerId, buildingId, divisionId, total]
    action: "계약 생성 — 견적의 ID·금액 복사, status=pending, 시작일=수주일+14일, 종료일=시작일+1년"
    writes: {contracts: [contractNo, id, quoteId, customerId, buildingId, divisionId, startDate, endDate, annualAmount, status, createdAt]}
    impl: builtin
    guard: 계약이 이미 연결돼 있으면 만들지 않는다(같은 견적에서 계약 2건 방지)

  - id: A02
    name: 텍스트 ID → 연결 필드 채우기
    base: division
    table: quotes
    trigger: "레코드가 만들어질 때(견적 엔진·동기화가 API로 넣은 레코드)"
    watch: [customerId, buildingId]
    condition: "customerId·buildingId는 있는데 연결 필드가 비어 있음"
    reads: [customerId, buildingId, customer, building]
    action: "고객·건물 사본에서 id가 같은 레코드를 찾아 customer·building 연결에 넣는다(계약·점검 일정·청구도 같은 패턴)"
    writes: {quotes: [customer, building]}
    impl: builtin
    guard: 못 찾으면 연결을 비워 두고 자동화 오류에 남긴다(엉뚱한 레코드에 잇지 않음)

  - id: A03
    name: 계약 활성화 → 점검 일정 생성
    base: division
    table: contracts
    trigger: "레코드가 조건에 맞을 때: status = active"
    watch: [status]
    condition: "점검 횟수 = 0"
    reads: [점검 횟수, id, buildingId, divisionId, startDate, endDate, visitsPerYear]
    action: "연간 방문 횟수만큼 점검 일정 생성 — 예정일 = 시작일 + k × (12 ÷ visitsPerYear)개월, 점검원 순번 배정"
    writes: {inspections: [id, divisionId, contractId, buildingId, assigneeId, scheduledDate, visitNo, status, createdAt]}
    impl: script
    guard: 이미 일정이 있으면 만들지 않는다. 시드 생성(airtable/lib/seed.js)과 같은 규칙

  - id: A04
    name: 점검 D-7 담당자 알림
    base: division
    table: inspections
    trigger: "일정: 매일 08:00"
    watch: []
    condition: "status = scheduled 이고 D-day ≤ 7"
    reads: [status, D-day, assignee, 건물명]
    action: "담당 점검원에게 방문 예정 메일(건물명·예정일)"
    writes: {}
    impl: builtin
    guard: 담당자가 비어 있으면 운영 관리자에게 보낸다

  - id: A05
    name: 점검 결과 입력 → 청구 생성
    base: division
    table: inspectionResults
    trigger: "레코드가 만들어질 때"
    watch: [result]
    condition: "결과가 pass 또는 actionRequired이고 연결된 청구가 없음"
    reads: [result, 청구, id, contractId, divisionId]
    action: "청구 생성 — 금액 = 연간 금액 ÷ 연간 방문 횟수, 발행일 = 오늘, 기한 = +30일, status=issued"
    writes: {invoices: [invoiceNo, id, divisionId, contractId, resultId, amount, issuedAt, dueDate, paidAmount, status, createdAt]}
    impl: builtin
    guard: 같은 결과에 청구가 있으면 건너뜀. 부적합(fail)은 재점검 뒤 청구

  - id: A06
    name: 미수 경과 → overdue 전환·알림
    base: division
    table: invoices
    trigger: "일정: 매일 09:00"
    watch: []
    condition: "status = issued 이고 기한(dueDate)이 지남"
    reads: [status, dueDate, 경과일, 미수액, contract]
    action: "status를 overdue로 바꾸고 영업 담당에게 미수 목록 알림"
    writes: {invoices: [status]}
    impl: builtin
    guard: 상태 전이 가드(A07)가 issued → overdue만 허용. 입금(paid)된 건은 바뀌지 않음

  - id: A07
    name: 상태 전이 가드
    base: division
    table: quotes
    trigger: "레코드가 수정될 때(감시 필드 status) — 견적·계약·점검 일정·청구에 같은 스크립트"
    watch: [status]
    condition: "statusConfirmed → status 전이가 규칙(docs/schema.md 상태 전이 표)에 없음"
    reads: [status, statusConfirmed, statusNote]
    action: "허용이면 statusConfirmed 갱신, 아니면 status를 되돌리고 statusNote에 사유"
    writes: {quotes: [status, statusConfirmed, statusNote]}
    impl: script:status-guard.js
    guard: 되돌린 수정이 다시 트리거돼도 '변경 없음'으로 끝남(무한 반복 없음)

  - id: A08
    name: 고객·건물 중복 감지
    base: hub
    table: buildings
    trigger: "레코드가 만들어지거나 roadAddress(고객은 businessNo)가 바뀔 때"
    watch: [roadAddress]
    condition: "정규화한 주소(고객은 사업자번호 숫자)가 같은 레코드가 있음"
    reads: [id, roadAddress, dupCandidates, dupStatus]
    action: "서로 dupCandidates로 잇고 dupStatus=후보 있음, addressKey 기록"
    writes: {buildings: [dupCandidates, dupStatus, dupCheckedAt, addressKey]}
    impl: script:duplicate-detect.js
    guard: 자동 병합·삭제 없음. 사람이 '검토 완료'로 바꾸면 같은 후보로 다시 띄우지 않음

  - id: A09
    name: 허브 → 사업부 사본 동기화
    base: division
    table: buildings
    trigger: "일정: 매시 정각"
    watch: []
    condition: "원본 건수가 직전 정상 실행 대비 30% 넘게 줄지 않음"
    reads: [id, syncHash, hubMissing]
    action: "검증 통과 건만 생성·수정, 사라진 건은 hubMissing 표시, 결과를 동기화 기록에"
    writes: {buildings: [id, customerId, roadAddress, name, mainPurpose, totalArea, groundFloors, undergroundFloors, syncHash, syncedAt, hubMissing, customer], syncRuns: [id, divisionId, runner, tableKey, startedAt, finishedAt, sourceCount, previousCount, status, note]}
    impl: "script:sync-safety.js · n8n:sync-safety.json"
    guard: 급감이면 반영 중단, 실패 건만 건너뛰고 기록

  - id: A10
    name: 자동화 오류 요약 알림
    base: division
    table: automationErrors
    trigger: "일정: 매시 10분(모든 Base에 같은 스크립트)"
    watch: []
    condition: "notified가 꺼진 오류가 있음"
    reads: [automation, stage, tableName, recordId, message, occurredAt, notified]
    action: "자동화별로 묶은 요약을 웹훅 1번으로 보내고 notified 켬"
    writes: {automationErrors: [notified, notifiedAt]}
    impl: script:error-alert.js
    guard: 발송 실패면 notified를 켜지 않아 다음 실행이 다시 보냄

  - id: A11
    name: 계약 만료 60일 전 갱신 알림
    base: division
    table: contracts
    trigger: "일정: 매주 월요일 09:00"
    watch: []
    condition: "status = active 이고 종료일까지 60일 이하"
    reads: [status, endDate, contractNo, 미수금, customer]
    action: "영업 담당에게 갱신 대상 목록(미수금 함께) 알림"
    writes: {}
    impl: builtin
    guard: 미수금이 있는 계약은 목록 맨 위에 표시
